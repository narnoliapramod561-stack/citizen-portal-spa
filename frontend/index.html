<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCI - Plastic Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center p-6">

    <h1 class="text-2xl font-bold mb-2 text-green-400">PCI FIELD CAPTURE</h1>
    <p class="text-slate-400 mb-8 text-center text-sm">Convert waste into Verifiable Compliance Units</p>

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Location Status</label>
            <div id="location-status" class="text-sm font-mono bg-slate-900 p-3 rounded border border-slate-700">
                Waiting for GPS...
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Upload Plastic Evidence</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" 
                   class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer">
        </div>

        <button id="submitBtn" class="w-full bg-green-500 hover:bg-green-400 text-slate-900 font-bold py-4 rounded-xl transition-all disabled:opacity-50">
            GENERATE PCU CREDIT
        </button>

        <div id="result" class="mt-6 hidden p-4 rounded-lg bg-green-900/30 border border-green-500/50 text-green-200 text-xs font-mono break-all">
        </div>
    </div>

    <script>
        let userLat = null;
        let userLong = null;

        // 1. AUTO-GET LOCATION ON LOAD
        navigator.geolocation.getCurrentPosition((pos) => {
            userLat = pos.coords.latitude;
            userLong = pos.coords.longitude;
            document.getElementById('location-status').innerText = `LAT: ${userLat.toFixed(4)} | LONG: ${userLong.toFixed(4)}`;
            document.getElementById('location-status').classList.add('text-green-400');
        }, (err) => {
            document.getElementById('location-status').innerText = "ERROR: Enable GPS to proceed";
            document.getElementById('location-status').classList.add('text-red-400');
        });

        // 2. HANDLE SUBMISSION
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            
            if (!userLat || !fileInput.files[0]) {
                alert("Please ensure GPS is on and image is selected");
                return;
            }

            const formData = new FormData();
            formData.append("lat", userLat);
            formData.append("long", userLong);
            formData.append("image", fileInput.files[0]);

            document.getElementById('submitBtn').innerText = "PROVING COMPLIANCE...";
            document.getElementById('submitBtn').disabled = true;

            try {
                // REPLACE THIS URL with your actual Antigravity/Render backend URL
                const response = await fetch("http://localhost:8000/submit-plastic", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<strong>SUCCESS: PCU GENERATED</strong><br>${JSON.stringify(data.pcu, null, 2)}`;
            } catch (error) {
                alert("Upload failed. Is the backend running?");
            } finally {
                document.getElementById('submitBtn').innerText = "GENERATE PCU CREDIT";
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
